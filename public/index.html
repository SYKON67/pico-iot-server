<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pico IoT Server - VL53L0X Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        header {
            background: white;
            padding: 30px;
            border-radius: 10px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        h1 {
            color: #667eea;
            margin-bottom: 10px;
        }
        
        .status {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            color: #666;
        }
        
        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #4CAF50;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        .stat-card {
            text-align: center;
        }
        
        .stat-label {
            color: #999;
            font-size: 12px;
            text-transform: uppercase;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }
        
        .stat-value {
            font-size: 32px;
            font-weight: bold;
            color: #667eea;
        }
        
        .stat-unit {
            color: #999;
            font-size: 14px;
            margin-top: 5px;
        }
        
        .chart-container {
            position: relative;
            height: 300px;
            margin-bottom: 30px;
        }
        
        .data-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        
        .data-table th {
            background: #667eea;
            color: white;
            padding: 12px;
            text-align: left;
            font-size: 12px;
            text-transform: uppercase;
        }
        
        .data-table td {
            padding: 12px;
            border-bottom: 1px solid #eee;
        }
        
        .data-table tr:hover {
            background: #f9f9f9;
        }
        
        .data-table tr:last-child td {
            border-bottom: none;
        }
        
        .timestamp {
            color: #999;
            font-size: 12px;
        }
        
        .refresh-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s;
        }
        
        .refresh-btn:hover {
            background: #764ba2;
        }
        
        .no-data {
            text-align: center;
            color: #999;
            padding: 20px;
        }
        
        .latest-alert {
            background: #e3f2fd;
            border-left: 4px solid #667eea;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
        }
        
        .latest-alert strong {
            color: #667eea;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📡 Pico IoT Server</h1>
            <p>VL53L0X Time-of-Flight Sensor Dashboard</p>
            <div class="status">
                <div class="status-dot"></div>
                <span>Live gegevens • Bijgewerkt elke 5 seconden</span>
            </div>
        </header>
        
        <div class="grid">
            <div class="card stat-card">
                <div class="stat-label">Huidige Afstand</div>
                <div class="stat-value" id="latest">--</div>
                <div class="stat-unit">mm</div>
            </div>
            
            <div class="card stat-card">
                <div class="stat-label">Minimum</div>
                <div class="stat-value" id="min">--</div>
                <div class="stat-unit">mm</div>
            </div>
            
            <div class="card stat-card">
                <div class="stat-label">Maximum</div>
                <div class="stat-value" id="max">--</div>
                <div class="stat-unit">mm</div>
            </div>
            
            <div class="card stat-card">
                <div class="stat-label">Gemiddelde</div>
                <div class="stat-value" id="avg">--</div>
                <div class="stat-unit">mm</div>
            </div>
        </div>
        
        <div class="card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h2 style="color: #667eea;">Afstandsmeting Over Tijd</h2>
                <button class="refresh-btn" onclick="refreshData()">🔄 Vernieuwen</button>
            </div>
            <div class="chart-container">
                <canvas id="distanceChart"></canvas>
            </div>
        </div>
        
        <div class="card">
            <h2 style="color: #667eea; margin-bottom: 20px;">Meetgegevens</h2>
            <div id="latestAlert" class="latest-alert" style="display: none;">
                <strong>⏱️ Laatste meting:</strong> <span id="latestTime"></span>
            </div>
            <div id="tableContainer"></div>
        </div>
    </div>
    
    <script>
        let chart = null;
        
        async function fetchData() {
            try {
                const [dataRes, statsRes] = await Promise.all([
                    fetch('/api/data'),
                    fetch('/api/stats')
                ]);
                
                const data = await dataRes.json();
                const stats = await statsRes.json();
                
                updateStats(stats);
                updateChart(data);
                updateTable(data);
                
                return true;
            } catch (error) {
                console.error('Error fetching data:', error);
                return false;
            }
        }
        
        function updateStats(stats) {
            document.getElementById('latest').textContent = stats.latest ? stats.latest.distance : '--';
            document.getElementById('min').textContent = stats.min !== null ? stats.min : '--';
            document.getElementById('max').textContent = stats.max !== null ? stats.max : '--';
            document.getElementById('avg').textContent = stats.average !== null ? stats.average : '--';
        }
        
        function updateChart(data) {
            const ctx = document.getElementById('distanceChart').getContext('2d');
            
            const labels = data.map(d => {
                const time = new Date(d.timestamp).toLocaleTimeString('nl-NL');
                return time;
            });
            
            const distances = data.map(d => d.distance);
            
            if (chart) {
                chart.data.labels = labels;
                chart.data.datasets[0].data = distances;
                chart.update();
            } else {
                chart = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: labels,
                        datasets: [{
                            label: 'Afstand (mm)',
                            data: distances,
                            borderColor: '#667eea',
                            backgroundColor: 'rgba(102, 126, 234, 0.1)',
                            borderWidth: 2,
                            fill: true,
                            tension: 0.4,
                            pointRadius: 4,
                            pointBackgroundColor: '#667eea',
                            pointBorderColor: '#fff',
                            pointBorderWidth: 2
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: {
                                display: true,
                                labels: {
                                    color: '#666',
                                    font: { size: 12 }
                                }
                            }
                        },
                        scales: {
                            y: {
                                beginAtZero: true,
                                ticks: {
                                    callback: function(value) {
                                        return value + ' mm';
                                    }
                                }
                            }
                        }
                    }
                });
            }
        }
        
        function updateTable(data) {
            const container = document.getElementById('tableContainer');
            
            if (data.length === 0) {
                container.innerHTML = '<div class="no-data">Nog geen gegevens ontvangen. Wacht op eerste meting...</div>';
                document.getElementById('latestAlert').style.display = 'none';
                return;
            }
            
            // Show latest alert
            const latest = data[data.length - 1];
            const latestTime = new Date(latest.timestamp).toLocaleString('nl-NL');
            document.getElementById('latestTime').textContent = latestTime;
            document.getElementById('latestAlert').style.display = 'block';
            
            // Reverse to show newest first
            const reversedData = [...data].reverse();
            
            let html = `
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Afstand</th>
                            <th>Tijd</th>
                        </tr>
                    </thead>
                    <tbody>
            `;
            
            reversedData.forEach((item, index) => {
                const time = new Date(item.timestamp).toLocaleString('nl-NL');
                html += `
                    <tr>
                        <td>${data.length - index}</td>
                        <td><strong>${item.distance} ${item.unit || 'mm'}</strong></td>
                        <td class="timestamp">${time}</td>
                    </tr>
                `;
            });
            
            html += `
                    </tbody>
                </table>
            `;
            
            container.innerHTML = html;
        }
        
        function refreshData() {
            fetchData().then(success => {
                if (success) {
                    console.log('✓ Data bijgewerkt');
                }
            });
        }
        
        // Auto-refresh elke 5 seconden
        fetchData();
        setInterval(refreshData, 5000);
    </script>
</body>
</html>
